workflows:
  ios-release:
    name: Ionic iOS App Store Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: Okkkkk
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.almasria.autoparts
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Web Assets
        script: |
          # PRODUCTION BUILD — diagnostic mode disabled.
          export BUILD_COMMIT="${CM_COMMIT:-$(git rev-parse HEAD)}"
          export BUILD_NUMBER="${BUILD_NUMBER:-0}"
          npm run build
          # Native TestFlight build must not bundle web service workers.
          # They are web-only and can trigger iOS notification/service-worker flows.
          rm -f dist/sw.js dist/sw-push.js
      - name: Prepare iOS Platform
        script: |
          if [ ! -d "ios" ]; then
            echo "⚠️ iOS Platform is missing! Recreating from scratch..."
            npx cap add ios
          fi
          npx cap sync ios
      - name: Auto-increment Version & Build Number (Auto-pilot)
        script: |
          IOS_BUILD_NUMBER="${BUILD_NUMBER:-${CM_BUILD_ID:-2}}"
          case "$IOS_BUILD_NUMBER" in
            ''|*[!0-9]*) IOS_BUILD_NUMBER=2 ;;
          esac
          cd ios/App
          # Marketing version must be higher than any previously approved train (1.0)
          agvtool new-marketing-version 1.0.1
          agvtool new-version -all "$IOS_BUILD_NUMBER"
          # Force the archive's final Info.plist values; prevents App Store uploads
          # from falling back to the closed 1.0 pre-release train.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" App/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)" = "1.0.1"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            MARKETING_VERSION=1.0.1 CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            -showBuildSettings | grep -q 'MARKETING_VERSION = 1.0.1'
      - name: Set up Code Signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA (Xcode Build)
        script: |
          IOS_BUILD_NUMBER="${BUILD_NUMBER:-${CM_BUILD_ID:-2}}"
          case "$IOS_BUILD_NUMBER" in
            ''|*[!0-9]*) IOS_BUILD_NUMBER=2 ;;
          esac
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "MARKETING_VERSION=1.0.1 CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER"
      - name: Verify Final IPA Version
        script: |
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -type f | head -n 1)"
          test -n "$IPA_PATH"
          rm -rf /tmp/almasria-ipa-check
          mkdir -p /tmp/almasria-ipa-check
          unzip -q "$IPA_PATH" -d /tmp/almasria-ipa-check
          APP_PLIST="$(find /tmp/almasria-ipa-check/Payload -name Info.plist -type f | head -n 1)"
          test -n "$APP_PLIST"
          FINAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          FINAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          echo "Verified IPA version: $FINAL_VERSION ($FINAL_BUILD)"
          test "$FINAL_VERSION" = "1.0.1"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
